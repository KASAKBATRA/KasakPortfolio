<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12100e" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a2b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6a2b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgG)" />
  <circle cx="200" cy="150" r="180" fill="url(#nodeGlow)" />
  <circle cx="620" cy="340" r="160" fill="url(#tealGlow)" />

  <!-- Dotted Grid -->
  <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
  </pattern>
  <rect width="800" height="500" fill="url(#dotGrid)" />

  <!-- Window Header -->
  <rect x="20" y="20" width="760" height="42" rx="10" fill="#1b1814" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="44" cy="41" r="5" fill="#ef4444" />
  <circle cx="62" cy="41" r="5" fill="#f59e0b" />
  <circle cx="80" cy="41" r="5" fill="#10b981" />
  <text x="400" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d" text-anchor="middle" letter-spacing="1">CAG // SOVEREIGN AUDIT DATA PIPELINE ARCHITECTURE</text>
  <rect x="670" y="32" width="90" height="18" rx="9" fill="#ff6a2b" fill-opacity="0.15" stroke="#ff6a2b" stroke-width="1" />
  <text x="715" y="45" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff6a2b" text-anchor="middle">ACTIVE ETL</text>

  <!-- Main Pipeline Card 1: Data Ingestion -->
  <rect x="40" y="90" width="200" height="160" rx="12" fill="#161411" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <text x="60" y="120" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ff6a2b" letter-spacing="1">01 / INGESTION</text>
  <text x="60" y="145" font-family="'Fraunces', serif" font-size="16" fill="#f2efe8">NREGA &amp; GeM Feeds</text>
  <line x1="60" y1="160" x2="220" y2="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <text x="60" y="180" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• REST APIs / Microservices</text>
  <text x="60" y="200" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• 500K+ Disb. Records</text>
  <text x="60" y="220" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• Geo-Tagged Mustering</text>

  <!-- Connector Path 1 -->
  <path d="M 240 170 L 300 170" stroke="#ff6a2b" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="300,166 308,170 300,174" fill="#ff6a2b" />

  <!-- Main Pipeline Card 2: KNIME ETL & Validation Engine -->
  <rect x="300" y="90" width="220" height="240" rx="12" fill="#181512" stroke="#ff6a2b" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="320" y="120" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ff6a2b" letter-spacing="1">02 / CORE ENGINE</text>
  <text x="320" y="145" font-family="'Fraunces', serif" font-size="17" fill="#f2efe8">KNIME Workflow Core</text>
  <line x1="320" y1="160" x2="500" y2="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Sub-nodes inside KNIME -->
  <rect x="320" y="175" width="180" height="36" rx="6" fill="#201c18" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="335" cy="193" r="4" fill="#ff6a2b" />
  <text x="348" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f2efe8">Anomaly Detection (3σ)</text>

  <rect x="320" y="220" width="180" height="36" rx="6" fill="#201c18" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="335" cy="238" r="4" fill="#2dd4bf" />
  <text x="348" y="241" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f2efe8">Deduplication Cluster</text>

  <rect x="320" y="265" width="180" height="36" rx="6" fill="#201c18" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="335" cy="283" r="4" fill="#38bdf8" />
  <text x="348" y="286" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f2efe8">Multimodal VLM Check</text>

  <!-- Connector Path 2 -->
  <path d="M 520 210 L 570 210" stroke="#2dd4bf" stroke-width="2" />
  <polygon points="570,206 578,210 570,214" fill="#2dd4bf" />

  <!-- Main Pipeline Card 3: Persistence & Lakehouse -->
  <rect x="580" y="90" width="180" height="160" rx="12" fill="#161411" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <text x="600" y="120" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#2dd4bf" letter-spacing="1">03 / PERSISTENCE</text>
  <text x="600" y="145" font-family="'Fraunces', serif" font-size="16" fill="#f2efe8">AWS S3 &amp; SQL</text>
  <line x1="600" y1="160" x2="740" y2="160" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
  <text x="600" y="180" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• Immutable Checksums</text>
  <text x="600" y="200" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• Analytical Data Lake</text>
  <text x="600" y="220" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">• Zero-Trust Audit Logs</text>

  <!-- Bottom Telemetry Terminal Box -->
  <rect x="40" y="360" width="720" height="100" rx="12" fill="#13110e" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <text x="60" y="388" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#9a968d" letter-spacing="1">LIVE TELEMETRY STREAM // RECONCILIATION BENCHMARKS</text>

  <g transform="translate(60, 405)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#2dd4bf">100%</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9a968d">SCHEMA INTEGRITY</text>
  </g>
  <line x1="220" y1="405" x2="220" y2="445" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <g transform="translate(250, 405)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#ff6a2b">3.2σ</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9a968d">OUTLIER VARIANCE ISOLATION</text>
  </g>
  <line x1="480" y1="405" x2="480" y2="445" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <g transform="translate(510, 405)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#f2efe8">&lt; 140ms</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#9a968d">REST-TO-S3 PIPE LATENCY</text>
  </g>
</svg>
