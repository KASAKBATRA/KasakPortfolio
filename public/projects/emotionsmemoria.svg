<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="emotionsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141113" />
      <stop offset="100%" stop-color="#0a080a" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6a2b" />
      <stop offset="33%" stop-color="#ec4899" />
      <stop offset="66%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#emotionsBg)" />
  <circle cx="280" cy="250" r="220" fill="url(#amberGlow)" />
  <circle cx="620" cy="200" r="180" fill="url(#pinkGlow)" />

  <!-- Dotted Grid -->
  <pattern id="dotGridE" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06" />
  </pattern>
  <rect width="800" height="500" fill="url(#dotGridE)" />

  <!-- Window Chrome Header -->
  <rect x="20" y="20" width="760" height="42" rx="10" fill="#1b171a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  <circle cx="44" cy="41" r="5" fill="#ef4444" />
  <circle cx="62" cy="41" r="5" fill="#f59e0b" />
  <circle cx="80" cy="41" r="5" fill="#10b981" />
  <text x="400" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d" text-anchor="middle" letter-spacing="1">emotionsmemoria.netlify.app // AI MEMORY PRESERVATION ENGINE</text>
  <rect x="670" y="32" width="90" height="18" rx="9" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
  <text x="715" y="45" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ec4899" text-anchor="middle">LIVE APP</text>

  <!-- Left Side: Interactive Emotion Wheel Graphic -->
  <g transform="translate(240, 260)">
    <!-- Outer concentric rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#wheelGrad)" stroke-width="12" stroke-opacity="0.8" />
    <circle cx="0" cy="0" r="80" fill="#161216" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="0" cy="0" r="45" fill="#201a20" stroke="#ff6a2b" stroke-opacity="0.6" stroke-width="1.5" />
    
    <!-- Center Label -->
    <text x="0" y="-4" font-family="'Fraunces', serif" font-size="14" fill="#f2efe8" text-anchor="middle">Joy &amp; Nostalgia</text>
    <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff6a2b" text-anchor="middle">98.2% CONFIDENCE</text>

    <!-- Radiating Emotion Spokes -->
    <circle cx="0" cy="-110" r="8" fill="#ff6a2b" />
    <circle cx="110" cy="0" r="8" fill="#ec4899" />
    <circle cx="0" cy="110" r="8" fill="#8b5cf6" />
    <circle cx="-110" cy="0" r="8" fill="#06b6d4" />

    <text x="0" y="-124" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f2efe8" text-anchor="middle">Gratitude</text>
    <text x="135" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f2efe8">Excitement</text>
    <text x="0" y="134" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f2efe8" text-anchor="middle">Serenity</text>
    <text x="-135" y="4" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f2efe8" text-anchor="end">Wonder</text>
  </g>

  <!-- Right Side: Digital Memory Archive Card -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="280" height="340" rx="16" fill="#191519" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    
    <!-- Photo Mockup Frame -->
    <rect x="18" y="18" width="244" height="150" rx="10" fill="#241d24" stroke="#ffffff" stroke-opacity="0.08" />
    <path d="M 30 145 L 85 90 L 140 135 L 180 100 L 250 155" fill="none" stroke="#ec4899" stroke-width="2" />
    <circle cx="90" cy="55" r="16" fill="#ff6a2b" fill-opacity="0.6" />
    <text x="140" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#9a968d" text-anchor="middle">AI Visual Feature Map</text>

    <text x="18" y="196" font-family="'Fraunces', serif" font-size="18" fill="#f2efe8">Memory Capsule #042</text>
    <text x="18" y="216" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">Emotion Spectrum: Euphoric Warmth</text>
    <text x="18" y="234" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9a968d">Synthesized: Certificate of Preservation</text>

    <!-- Tags -->
    <rect x="18" y="252" width="70" height="22" rx="11" fill="#ff6a2b" fill-opacity="0.15" stroke="#ff6a2b" stroke-width="1" />
    <text x="53" y="267" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff6a2b" text-anchor="middle">AI Vision</text>

    <rect x="96" y="252" width="80" height="22" rx="11" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" />
    <text x="136" y="267" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ec4899" text-anchor="middle">Emotions API</text>

    <!-- CTA -->
    <rect x="18" y="290" width="244" height="34" rx="8" fill="#ff6a2b" />
    <text x="140" y="312" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LAUNCH LIVE MEMORIA APP →</text>
  </g>
</svg>
