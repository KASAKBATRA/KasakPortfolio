<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a2b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff6a2b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181614" />
      <stop offset="100%" stop-color="#0c0b09" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2efe8" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)" />

  <!-- Squircle Base with Border -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" stroke="#ff6a2b" stroke-opacity="0.35" stroke-width="2" />

  <!-- Inner Tech Nodes Grid Accent -->
  <circle cx="16" cy="16" r="1.5" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="48" cy="16" r="1.5" fill="#ffffff" fill-opacity="0.15" />
  <circle cx="16" cy="48" r="1.5" fill="#ffffff" fill-opacity="0.15" />

  <!-- Monogram "K" in High-Contrast Editorial Serif -->
  <text x="24" y="44" font-family="'Fraunces', 'Instrument Serif', 'Georgia', serif" font-size="34" font-weight="700" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">K</text>

  <!-- Glowing Burnt-Orange Audit Node Dot -->
  <circle cx="42" cy="41" r="4.5" fill="#ff6a2b" />
  <circle cx="42" cy="41" r="2" fill="#ffffff" />
  <circle cx="42" cy="41" r="7" fill="none" stroke="#ff6a2b" stroke-opacity="0.6" stroke-width="1.2" />
</svg>
